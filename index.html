<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>คำคม · เกมฝึกคำศัพท์ภาษาไทย</title>
<meta name="description" content="เกมคำคมตามกติกาทางการ — กระดาน 15x9 ตรวจคำกับพจนานุกรมราชบัณฑิตฯ ฝึกนักเรียนกับบอท" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // เก็บ error ไว้ใน <title> เพื่อดีบักบนเครื่องที่ไม่มี console
  window.addEventListener('error', (e) => { document.title = 'ERR: ' + (e.message || e.type); });
  window.addEventListener('unhandledrejection', (e) => { document.title = 'REJ: ' + (e.reason?.message || e.reason); });
</script>
</head>
<body>
<div class="app">
  <header class="topbar glass">
    <div class="brand">
      <span class="logo">คม</span>
      <div>
        <h1>คำคม</h1>
        <p class="sub" id="sub">กำลังโหลดข้อมูล…</p>
      </div>
    </div>
    <button id="btn-new" class="btn btn-ghost" type="button">เกมใหม่</button>
  </header>

  <section class="scores">
    <div class="score glass" id="p0">
      <span class="who" id="n0">ผู้เล่น 1</span>
      <strong id="s0">0</strong>
    </div>
    <div class="turn" id="turnLabel">—</div>
    <div class="score glass" id="p1">
      <span class="who" id="n1">ผู้เล่น 2</span>
      <strong id="s1">0</strong>
    </div>
  </section>

  <main class="play-area">
    <div class="board-wrap glass">
      <div id="board" class="board" role="grid" aria-label="กระดานคำคม 15 คอลัมน์ 9 แถว"></div>
    </div>

    <aside class="side">
      <section class="preview glass" id="preview">
        <span class="preview-label">คำที่กำลังวาง</span>
        <span class="preview-words" id="previewWords">—</span>
        <span class="preview-score" id="previewScore"></span>
      </section>

      <div class="rack" id="rack" aria-label="เบี้ยในมือ"></div>
      <div class="palette" id="palette" aria-label="สระบน-ล่างและวรรณยุกต์ (เบี้ยกระดาษ)"></div>

      <div class="actions">
        <button id="btn-play" class="btn btn-primary" type="button">เล่น</button>
        <button id="btn-recall" class="btn btn-soft" type="button">เก็บเบี้ย</button>
        <button id="btn-exchange" class="btn btn-soft" type="button">เปลี่ยนเบี้ย</button>
        <button id="btn-pass" class="btn btn-soft" type="button">ผ่านตา</button>
      </div>
    </aside>
  </main>

  <div id="roomBar" class="room-bar glass" hidden>
    <span>ห้อง <strong id="roomCode">—</strong></span>
    <button id="btn-copy-link" class="btn btn-ghost" type="button">คัดลอกลิงก์เชิญ</button>
    <button id="btn-room-start" class="btn btn-primary btn-sm" type="button">เริ่มเล่น</button>
  </div>

  <div id="dbg" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- หน้าตั้งเกม -->
  <div id="setup" class="modal" hidden>
    <div class="modal-card glass">
      <h2>เริ่มเกมคำคม</h2>
      <p class="muted">กระดาน 15×9 · เบี้ย 104 ตัว · กติกาทางการ EduPLOYS</p>

      <fieldset>
        <legend>โหมดเล่น</legend>
        <label class="opt"><input type="radio" name="mode" value="bot" checked /> เล่นกับบอท</label>
        <label class="opt"><input type="radio" name="mode" value="local" /> 2 คนบนเครื่องเดียว</label>
      </fieldset>

      <fieldset id="levelBox">
        <legend>ระดับบอท</legend>
        <label class="opt"><input type="radio" name="level" value="easy" /> ง่าย (เล่นพลาดได้)</label>
        <label class="opt"><input type="radio" name="level" value="medium" checked /> ปานกลาง</label>
        <label class="opt"><input type="radio" name="level" value="hard" /> ยาก (หาคะแนนสูงสุด)</label>
      </fieldset>

      <button id="btn-start" class="btn btn-primary wide" type="button">เริ่มเล่น</button>

      <hr class="sep" />
      <fieldset>
        <legend>เล่นกับเพื่อน 2 เครื่อง</legend>
        <div class="row">
          <button id="btn-create-room" class="btn btn-soft" type="button">สร้างห้อง</button>
          <input id="inp-code" class="code" placeholder="รหัสห้อง" maxlength="6" />
          <button id="btn-join-room" class="btn btn-soft" type="button">เข้าห้อง</button>
        </div>
        <label class="opt small"><input type="checkbox" id="chk-challenge" /> ใช้โหมด Challenge (ลงคำก่อนแล้วค่อยตรวจ)</label>
        <p class="muted small">ส่งลิงก์ให้เพื่อนเปิดบนอีกเครื่อง แล้วกด "เริ่มเล่น" เมื่อเข้าครบ 2 คน</p>
      </fieldset>
    </div>
  </div>

  <!-- สรุปผล -->
  <div id="summary" class="modal" hidden>
    <div class="modal-card glass wide-card">
      <h2 id="summaryTitle">จบเกม</h2>
      <p class="muted" id="summaryReason"></p>
      <table class="log">
        <thead><tr><th>#</th><th>ผู้เล่น</th><th>คำที่เล่น</th><th>คะแนน</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
      <button id="btn-again" class="btn btn-primary wide" type="button">เล่นอีกครั้ง</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script>
  if (new URLSearchParams(location.search).has('debug')) {
    addEventListener('load', () => setTimeout(() => {
      const dbgEl = document.getElementById('dbg');
      if (dbgEl) dbgEl.textContent = window.__dbg || 'none';
      const b = document.getElementById('board');
      document.title = JSON.stringify({
        vw: innerWidth,
        board: Math.round(b.getBoundingClientRect().width),
        cell: Math.round(b.querySelector('.cell')?.getBoundingClientRect().width || 0),
        cols: getComputedStyle(b).gridTemplateColumns.split(' ').length,
      });
    }, 1500));
  }
</script>
</body>
</html>
